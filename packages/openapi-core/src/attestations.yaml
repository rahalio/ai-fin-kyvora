openapi: 3.1.0
info:
  title: Kyvora Attestations API
  version: 0.1.0
  description: |
    Assurance-levelled attestation request, issue, refuse, revoke, and document-recollect exceptions (BR-1, BR-2, BR-3).
  x-domain: att
  license:
    name: Proprietary
servers:
  - url: https://api.kyvora.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Attestations
    description: Attestation exchange
x-codegen:
  preserveOnClean:
    - extensions

paths:
  /v1/attestations:
    get:
      operationId: listAttestations
      tags: [Attestations]
      summary: List attestations
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema: { type: string, enum: [pending, issued, refused, expired, revoked, disputed] }
        - name: subjectId
          in: query
          schema: { type: string }
        - name: relyingPartyId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Attestations page
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationListResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
    post:
      operationId: requestAttestation
      tags: [Attestations]
      summary: Request a purpose-scoped attestation (may issue or refuse)
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attestations.schemas.yaml#/components/schemas/AttestationRequest
      responses:
        '201':
          description: Attestation issued or refused
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false

  /v1/attestations/{attestationId}:
    get:
      operationId: getAttestation
      tags: [Attestations]
      summary: Get attestation
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
      responses:
        '200':
          description: Attestation
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false

  /v1/attestations/{attestationId}/issue:
    post:
      operationId: issueAttestation
      tags: [Attestations]
      summary: Issue signed attestation with liability and screening freshness
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attestations.schemas.yaml#/components/schemas/AttestationIssue
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false

  /v1/attestations/{attestationId}/refuse:
    post:
      operationId: refuseAttestation
      tags: [Attestations]
      summary: Refuse incomplete or over-broad attestation request
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attestations.schemas.yaml#/components/schemas/AttestationRefuse
      responses:
        '200':
          description: Refused
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false

  /v1/attestations/{attestationId}/revoke:
    post:
      operationId: revokeAttestation
      tags: [Attestations]
      summary: Revoke or invalidate an attestation
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attestations.schemas.yaml#/components/schemas/AttestationRevoke
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false

  /v1/attestations/{attestationId}/document-recollect-exception:
    post:
      operationId: recordDocumentRecollectException
      tags: [Attestations]
      summary: Record policy exception to re-collect documents despite valid attestation (BR-2)
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attestations.schemas.yaml#/components/schemas/DocumentRecollectException
      responses:
        '200':
          description: Exception recorded
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Attestation
      x-dynamodb:
        entityType: "ATTESTATION"
        pkPatternTemplate: "ATTESTATION#${attestationId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth

